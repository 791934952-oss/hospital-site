<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>吴荣杰的打球记录 - 首页</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a class="logo" href="index.html">吴荣杰🏀</a>
      <button class="nav-toggle" aria-label="菜单">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="about.html">个人介绍</a></li>
        <li><a href="record.html">打球记录</a></li>
        <li><a href="moments.html">精彩瞬间</a></li>
        <li><a href="contact.html">联系我</a></li>
      </ul>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="fade-in">
        <h1 class="title">吴荣杰的打球记录</h1>
        <p class="subtitle">记录篮球训练、比赛、成长和精彩瞬间。每一次突破、每一次防守、每一次团队配合，都值得被记住。</p>
        <div class="button-row">
          <a class="btn btn-primary" href="record.html">查看数据记录</a>
          <a class="btn btn-secondary" href="moments.html">进入高光时刻</a>
        </div>
      </div>
      <div class="card fade-in">
        <div class="avatar">头像位</div>
      </div>
    </section>

    <section class="grid-3">
      <article class="card stat-card fade-in">
        <h3 data-target="128" data-suffix=" 场">0 场</h3>
        <p>累计比赛场次</p>
      </article>
      <article class="card stat-card fade-in">
        <h3 data-target="21" data-suffix=" 分">0 分</h3>
        <p>场均得分</p>
      </article>
      <article class="card stat-card fade-in">
        <h3 data-target="46" data-suffix="%">0%</h3>
        <p>投篮命中率</p>
      </article>
    </section>

    <h2 class="section-title">近期动态</h2>
    <section class="timeline">
      <article class="card timeline-item fade-in">
        <h4>4月训练营：强化控运与终结</h4>
        <p>持续进行每周 4 次球感与对抗训练，重点提升变向后的出手稳定性。</p>
      </article>
      <article class="card timeline-item fade-in">
        <h4>校际联赛：单场 27 分新高</h4>
        <p>外线命中 4 记三分，并在关键第四节完成 2 次抢断，帮助球队逆转。</p>
      </article>
    </section>
  </main>

  <footer class="footer">© 2026 吴荣杰的打球记录</footer>
  <script src="script.js"></script>
</body>
</html>
