<head>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a class="logo" href="index.html">吴荣杰🏀</a>
      <button class="nav-toggle" aria-label="菜单">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>

      </ul>

  <main>
    <h1 class="title fade-in">训练与比赛记录</h1>
    <p class="subtitle fade-in">通过数据看成长：从基础训练到实战表现，持续复盘与进步。</p>

    <section class="grid-3">
      <article class="card stat-card fade-in">
        <h3 data-target="5" data-suffix=" 次">0 次</h3>
        <p>每周训练频次</p>
      </article>
      <article class="card stat-card fade-in">
        <h3 data-target="8" data-suffix=" 次">0 次</h3>
        <p>场均助攻</p>
      </article>
      <article class="card stat-card fade-in">
        <h3 data-target="7" data-suffix=" 板">0 板</h3>
        <p>场均篮板</p>
      </article>
    </section>

    <h2 class="section-title">近期比赛数据</h2>
    <section class="card table-wrap fade-in">
      <table>
        <thead>
          <tr>
            <th>日期</th>
            <th>赛事</th>
            <th>得分</th>
            <th>助攻</th>
            <th>篮板</th>
            <th>命中率</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>2026-04-18</td>
            <td>城市联赛</td>
            <td>24</td>
            <td>9</td>
            <td>6</td>
            <td>51%</td>
          </tr>
          <tr>
            <td>2026-04-12</td>
            <td>友谊赛</td>
            <td>19</td>
            <td>7</td>
            <td>8</td>
            <td>45%</td>
          </tr>
          <tr>
            <td>2026-04-04</td>
            <td>校际联赛</td>
            <td>27</td>
            <td>6</td>
            <td>5</td>
            <td>54%</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer class="footer">数据只是结果，坚持训练才是答案。</footer>
  <script src="script.js"></script>
</body>
</html>
